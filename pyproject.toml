[project]
name = "renci-ner"
version = "1.1.0"
description = "A library for accessing RENCI NER services."
readme = "README.md"
authors = [
    { name = "Gaurav Vaidya", email = "gaurav@renci.org" }
]
keywords = ['biomedical', 'ner', 'nlp', 'named entity recognition', 'natural language processing', 'named entity linking']
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.8",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[project.scripts]
renci-ner = "renci_ner.cli:renci_ner"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable all rules that ruff format would normally apply
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]

# Optional but common
ignore = [
    "E501",  # let Ruff handle wrapping consistently
]

fixable = ["ALL"]
unfixable = []
